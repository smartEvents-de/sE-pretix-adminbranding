[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "se-pretix-adminbranding"
dynamic = ["version"]
description = "pretix-Plugin: pretix-Lila in Admin und Shop durch eine frei gewählte Farbe ersetzen"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "sE-pretix" }]
dependencies = []

[project.entry-points."pretix.plugin"]
se_pretix_adminbranding = "se_pretix_adminbranding:PretixPluginMeta"

[tool.setuptools.dynamic]
version = {attr = "se_pretix_adminbranding.__version__"}

[tool.setuptools.packages.find]
include = ["se_pretix_adminbranding*"]

[tool.setuptools.package-data]
se_pretix_adminbranding = ["templates/**/*.html"]
